name: Build goldportal.prx

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make curl

      - name: Get OpenOrbis toolchain and GoldHEN Plugins SDK
        run: |
          mkdir -p "$HOME/ps4"
          curl -sL https://github.com/illusion0001/OpenOrbis-PS4-Toolchain/releases/latest/download/toolchain.tar.gz | tar xz -C "$HOME/ps4"
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK "$HOME/ps4/GoldHEN_Plugins_SDK"
          export OO_PS4_TOOLCHAIN="$HOME/ps4/OpenOrbis/PS4Toolchain"
          ls "$OO_PS4_TOOLCHAIN"
          make -C "$HOME/ps4/GoldHEN_Plugins_SDK"

      - name: Build goldportal.prx
        run: |
          export OO_PS4_TOOLCHAIN="$HOME/ps4/OpenOrbis/PS4Toolchain"
          export GOLDHEN_SDK="$HOME/ps4/GoldHEN_Plugins_SDK"
          bash ps4_plugin/build.sh

      - name: Upload goldportal.prx
        uses: actions/upload-artifact@v4
        with:
          name: goldportal-prx
          path: ps4_plugin/goldportal.prx
          if-no-files-found: error
